name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # pulse-beacon depends on pulse-data (Java jar + Python). CI checks it out as a
  # sibling; set CI_PAT in repo secrets if pulse-data is private (else GITHUB_TOKEN).
  # Tagged builds resolve both repositories at the same immutable release tag;
  # ordinary branch/PR builds continue to test against pulse-data main.
  PULSE_DATA_REPO: inventzia-sci-tech/pulse-data
  PULSE_DATA_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}

jobs:
  # Finding 4: pulse-beacon-core builds from a clean Maven env — jep resolves from
  # Maven Central (no manual install-file), pulse-data from the local .m2.
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pulse-beacon
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PULSE_DATA_REPO }}
          ref: ${{ env.PULSE_DATA_REF }}
          path: pulse-data
          token: ${{ secrets.CI_PAT || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install pulse-data to local .m2
        run: mvn -B -ntp -f pulse-data/pom.xml clean install -DskipTests
      - name: Verify pulse-beacon-core (jep from Central)
        run: mvn -B -ntp -f pulse-beacon/core/java/pom.xml verify

  # Findings 1, 3, 5, 6: layout/imports, bundled runtime jar, regeneration drift,
  # and version consistency — the whole distribution smoke test on built artifacts.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pulse-beacon
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PULSE_DATA_REPO }}
          ref: ${{ env.PULSE_DATA_REF }}
          path: pulse-data
          token: ${{ secrets.CI_PAT || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tooling
        run: python -m pip install --upgrade build

      - name: Install pulse-data jar to local .m2 (needed by the runtime jar)
        run: mvn -B -ntp -f pulse-data/pom.xml clean install -DskipTests

      - name: Build the bundled runtime jar
        working-directory: pulse-beacon
        run: ./build-runtime-jar.sh

      - name: Version consistency (dev mode)
        working-directory: pulse-beacon
        run: bash check-versions.sh

      - name: Distribution smoke test
        working-directory: pulse-beacon
        run: bash dist-smoke-test.sh

  # The SQL gateways against a REAL MySQL server. H2 - even in MySQL compatibility mode - accepts DDL
  # that a managed MySQL refuses and reports column metadata differently, so only this job demonstrates
  # the storage guarantees. sql_require_primary_key is ON deliberately: a managed MySQL (Aiven) runs
  # that way and rejected our original DDL, so CI should hold us to the stricter setting rather than
  # the permissive default.
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pulse
          MYSQL_DATABASE: pulse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppulse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pulse-beacon
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PULSE_DATA_REPO }}
          ref: ${{ env.PULSE_DATA_REF }}
          path: pulse-data
          token: ${{ secrets.CI_PAT || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install pulse-data jar to the local .m2
        run: mvn -B -ntp -f pulse-data/pom.xml clean install -DskipTests

      # A managed MySQL (Aiven) runs with this ON and rejected our original DDL, so CI holds us to the
      # stricter setting. It is belt-and-braces: MySqlIntegrationTest asserts via getPrimaryKeys that
      # the ingestion id really is the primary key, which is the authoritative check and does not depend
      # on the server setting. So a runner without the mysql client reports it and carries on rather
      # than failing the job for a missing convenience.
      - name: Require a primary key, as a managed MySQL does
        run: |
          if command -v mysql >/dev/null 2>&1; then
            mysql -h 127.0.0.1 -P 3306 -uroot -ppulse \
              -e "SET PERSIST sql_require_primary_key = ON; SELECT @@sql_require_primary_key;"
          else
            echo "NOTE: no mysql client on this runner; sql_require_primary_key left at its default."
            echo "      The primary key is still asserted directly by MySqlIntegrationTest."
          fi

      # -Pmysql-it runs ONLY MySqlIntegrationTest, and that test fails rather than skips when it
      # cannot reach a server - so a green result here means it genuinely ran against MySQL.
      - name: SQL gateway integration tests (real MySQL)
        working-directory: pulse-beacon/core/java
        run: |
          mvn -B -ntp -Pmysql-it test \
            -Dpulse.it.mysql.url="jdbc:mysql://127.0.0.1:3306/pulse?sslMode=DISABLED&rewriteBatchedStatements=true" \
            -Dpulse.it.mysql.user=root \
            -Dpulse.it.mysql.password=pulse

  # Finding 2: the cross-language integration tests run against the INSTALLED wheels
  # (bundled jar via resolve_classpath) and FAIL rather than skip on a missing prereq.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pulse-beacon
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PULSE_DATA_REPO }}
          ref: ${{ env.PULSE_DATA_REF }}
          path: pulse-data
          token: ${{ secrets.CI_PAT || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build pulse-data jar + runtime jar
        run: |
          mvn -B -ntp -f pulse-data/pom.xml clean install -DskipTests
          cd pulse-beacon && ./build-runtime-jar.sh

      - name: Build release wheels (with bundled jar)
        run: |
          python -m pip install --upgrade build
          python -m build --wheel -o "$GITHUB_WORKSPACE/wheels" pulse-data
          python -m build --wheel -o "$GITHUB_WORKSPACE/wheels" pulse-beacon

      - name: Install wheels + run JPype integration (strict, against the artifact)
        run: |
          python -m venv /tmp/iv
          BEACON_WHEEL="$(find "$GITHUB_WORKSPACE/wheels" -maxdepth 1 -name 'pulse_beacon-*.whl' -print -quit)"
          test -n "$BEACON_WHEEL"
          /tmp/iv/bin/pip install "$GITHUB_WORKSPACE"/wheels/pulse_data-*.whl \
            "${BEACON_WHEEL}[jpype]" pytest
          # JAVA_HOME comes from setup-java; PULSE_REQUIRE_INTEGRATION makes a missing
          # prerequisite a failure, not a skip. Run the whole suite except the `jep`
          # tests (which need a source-tree Java build + native jep) — marker selection
          # so new installed-artifact tests are covered automatically, not a hand-listed set.
          PULSE_REQUIRE_INTEGRATION=1 /tmp/iv/bin/python -m pytest -q \
            "$GITHUB_WORKSPACE/pulse-beacon/tests" -m "not jep"

  # Release: on a vX.Y.Z tag, check out the same tag in both repositories, prove
  # that it matches both package versions, and record the resolved commit SHAs.
  # Publishing to PyPI / Maven Central remains a separate credentialed step.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [maven, dist, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pulse-beacon
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PULSE_DATA_REPO }}
          ref: ${{ github.ref_name }}
          path: pulse-data
          token: ${{ secrets.CI_PAT || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pulse-data jar to local .m2
        run: mvn -B -ntp -f pulse-data/pom.xml clean install -DskipTests
      - name: Validate immutable release inputs
        run: |
          test "$(git -C pulse-beacon describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          test "$(git -C pulse-data describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          cd pulse-beacon
          bash check-versions.sh --release --tag "$GITHUB_REF_NAME"
      - name: Release build
        run: |
          python -m pip install --upgrade build
          bash pulse-beacon/release-build.sh "$GITHUB_WORKSPACE/dist"
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "pulse-beacon=$(git -C pulse-beacon rev-parse HEAD)"
            echo "pulse-data=$(git -C pulse-data rev-parse HEAD)"
          } > dist/release-inputs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: |
            dist/*.whl
            dist/release-inputs.txt
